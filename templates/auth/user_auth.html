<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='forest-predict-icon.png') }}">
    <title>User Login - Forest Prediction System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0b2e1f 0%, #1a4f3a 100%);
            position: relative;
        }

        /* Forest-themed animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(70, 130, 70, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 90% 70%, rgba(34, 139, 34, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 30% 80%, rgba(60, 179, 113, 0.1) 0%, transparent 35%),
                radial-gradient(circle at 70% 20%, rgba(46, 125, 50, 0.1) 0%, transparent 35%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== AUTH CONTAINER ===== */
        .auth-container {
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== BACK HOME LINK ===== */
        .back-home {
            margin-bottom: 20px;
        }

        .back-home a {
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-home a:hover {
            background: rgba(60, 179, 113, 0.3);
            border-color: rgba(60, 179, 113, 0.5);
            transform: translateX(-5px);
        }

        .back-home i {
            font-size: 0.85rem;
        }

        /* ===== LOGIN CARD ===== */
        .auth-card {
            background: rgba(10, 20, 15, 0.95);
            backdrop-filter: blur(15px);
            padding: 45px 40px;
            border-radius: 32px;
            text-align: center;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Forest border effect */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #2e7d32, #66bb6a, #2e7d32);
        }

        /* ===== HEADER ===== */
        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-header i {
            font-size: 3.2rem;
            color: #66bb6a;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 15px rgba(102, 187, 106, 0.4));
        }

        .auth-header h2 {
            font-size: 2rem;
            color: white;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 280px;
            margin: 0 auto;
        }

        /* ===== GOOGLE BUTTON ===== */
        .google-btn {
            width: 100%;
            padding: 16px;
            background: white;
            border: none;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2e1a;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 20px 0 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .google-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 187, 106, 0.4);
            background: #f8fff8;
        }

        .google-btn img {
            width: 22px;
            height: 22px;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            margin: 20px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .divider span {
            padding: 0 15px;
        }

        /* ===== CONTINUE BUTTON ===== */
        .continue-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 2px solid rgba(102, 187, 106, 0.5);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .continue-btn:hover {
            background: rgba(102, 187, 106, 0.15);
            border-color: #66bb6a;
            transform: translateY(-2px);
        }

        .continue-btn i {
            color: #66bb6a;
        }

        /* ===== TERMS TEXT ===== */
        .terms-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            line-height: 1.6;
            margin: 20px 0;
        }

        .terms-text a {
            color: #66bb6a;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .terms-text a:hover {
            color: #81c784;
            text-decoration: underline;
        }

        /* ===== FOOTER ===== */
        .auth-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .auth-footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: #66bb6a;
        }

        .auth-footer span {
            color: rgba(255, 255, 255, 0.3);
        }

        /* ===== ALERT MESSAGE ===== */
        .alert {
            display: none;
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.15);
            color: #ff8a80;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .alert-success {
            background: rgba(102, 187, 106, 0.15);
            color: #a5d6a5;
            border: 1px solid rgba(102, 187, 106, 0.3);
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 20, 10, 0.9);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 187, 106, 0.2);
            border-top-color: #66bb6a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .auth-card {
                padding: 35px 25px;
            }

            .auth-header h2 {
                font-size: 1.8rem;
            }

            .auth-header i {
                font-size: 2.8rem;
            }

            .google-btn,
            .continue-btn {
                padding: 14px;
                font-size: 1rem;
            }

            .auth-footer {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
        }

        @media (max-width: 360px) {
            .auth-card {
                padding: 30px 20px;
            }

            .auth-header h2 {
                font-size: 1.5rem;
            }

            .auth-header p {
                font-size: 0.85rem;
            }

            .back-home a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">

        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-tree"></i>
                <h2>Welcome Back!</h2>
                <p>Sign in to access Forest Prediction System</p>
            </div>

            <div class="alert" id="alertMessage"></div>

            <button class="google-btn" id="googleSignIn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign in with Google
            </button>
        </div>

    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAAwmCILDU80tYyhI9F5cvr4LveGTINk_Q",
            authDomain: "forest-prediction-system.firebaseapp.com",
            projectId: "forest-prediction-system",
            storageBucket: "forest-prediction-system.firebasestorage.app",
            messagingSenderId: "505753280814",
            appId: "1:505753280814:web:ac79bbecd2acbdc0eb5abf"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        // DOM Elements
        const googleSignInBtn = document.getElementById('googleSignIn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const alertMessage = document.getElementById('alertMessage');

        // Google Sign In
        googleSignInBtn.addEventListener('click', async () => {
            try {
                loadingOverlay.style.display = 'flex';

                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');

                const result = await auth.signInWithPopup(provider);

                // Get user info
                const user = result.user;

                // Send to backend
                const response = await fetch('/api/auth/firebase-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        uid: user.uid,
                        email: user.email,
                        name: user.displayName,
                        photoUrl: user.photoURL,
                        provider: 'google'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    throw new Error(data.message || 'Login failed');
                }

            } catch (error) {
                console.error('Login error:', error);
                showAlert(error.message, 'error');
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        // Check if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const response = await fetch('/api/auth/check-session');
                    const data = await response.json();

                    if (data.authenticated) {
                        window.location.href = '/dashboard';
                    }
                } catch (error) {
                    console.error('Session check error:', error);
                }
            }
        });

        function showAlert(message, type) {
            alertMessage.textContent = message;
            alertMessage.className = `alert alert-${type}`;
            alertMessage.style.display = 'block';

            setTimeout(() => {
                alertMessage.style.display = 'none';
            }, 5000);
        }

        // Add animation on scroll
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.features-list li, .testimonial').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'all 0.6s ease';
            observer.observe(el);
        });
    </script>
</body>

</html>
