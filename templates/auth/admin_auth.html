<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='forest-predict-icon.png') }}">
    <title>Admin Login - Forest Prediction System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0b2e1f 0%, #1a4f3a 100%);
            position: relative;
        }

        /* Forest-themed animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(70, 130, 70, 0.2) 0%, transparent 30%),
                radial-gradient(circle at 90% 70%, rgba(34, 139, 34, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 30% 80%, rgba(60, 179, 113, 0.15) 0%, transparent 35%),
                radial-gradient(circle at 70% 20%, rgba(46, 125, 50, 0.15) 0%, transparent 35%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== ADMIN CONTAINER ===== */
        .admin-container {
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== BACK HOME LINK ===== */
        .back-home {
            margin-bottom: 20px;
        }

        .back-home a {
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-home a:hover {
            background: rgba(60, 179, 113, 0.3);
            border-color: rgba(60, 179, 113, 0.5);
            transform: translateX(-5px);
        }

        .back-home i {
            font-size: 0.85rem;
        }

        /* ===== ADMIN CARD ===== */
        .admin-card {
            background: rgba(10, 20, 15, 0.95);
            backdrop-filter: blur(15px);
            padding: 45px 40px;
            border-radius: 32px;
            text-align: center;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Forest border effect */
        .admin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #2e7d32, #66bb6a, #2e7d32);
        }

        /* ===== ADMIN HEADER ===== */
        .admin-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-header i {
            font-size: 3.2rem;
            color: #66bb6a;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 15px rgba(102, 187, 106, 0.4));
        }

        .admin-header h2 {
            font-size: 2rem;
            color: white;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .admin-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            padding: 6px 18px;
            border-radius: 50px;
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(102, 187, 106, 0.3);
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group label i {
            color: #66bb6a;
            margin-right: 5px;
        }

        .input-group {
            position: relative;
        }

        .input-group i:first-child {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 16px 45px 16px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #66bb6a;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(102, 187, 106, 0.15);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1;
            font-size: 1.1rem;
        }

        .password-toggle:hover {
            color: #66bb6a;
        }

        /* ===== LOGIN BUTTON ===== */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 187, 106, 0.4);
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn i {
            font-size: 1.2rem;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            margin: 25px 0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .divider span {
            padding: 0 15px;
        }

        /* ===== ADMIN FEATURES ===== */
        .admin-features {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 25px;
            margin-top: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-features h4 {
            color: #66bb6a;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-features ul {
            list-style: none;
        }

        .admin-features li {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            font-size: 0.95rem;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .admin-features li:hover {
            background: rgba(102, 187, 106, 0.1);
            transform: translateX(5px);
        }

        .admin-features li i {
            color: #66bb6a;
            font-size: 1.1rem;
            width: 22px;
        }

        /* ===== SECURITY NOTE ===== */
        .security-note {
            margin-top: 25px;
            padding: 15px;
            background: rgba(102, 187, 106, 0.1);
            border-radius: 16px;
            color: #a5d6a5;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(102, 187, 106, 0.2);
        }

        .security-note i {
            color: #66bb6a;
            font-size: 1.2rem;
        }

        /* ===== ALERT MESSAGES ===== */
        .alert {
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: none;
            font-size: 0.95rem;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.15);
            color: #ff8a80;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .alert-success {
            background: rgba(102, 187, 106, 0.15);
            color: #a5d6a5;
            border: 1px solid rgba(102, 187, 106, 0.3);
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 20, 10, 0.9);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 187, 106, 0.2);
            border-top-color: #66bb6a;
            border-right-color: #2e7d32;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== FOOTER NOTE ===== */
        .footer-note {
            margin-top: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 480px) {
            .admin-card {
                padding: 35px 25px;
            }

            .admin-header h2 {
                font-size: 1.8rem;
            }

            .admin-header i {
                font-size: 2.8rem;
            }

            .input-group input {
                padding: 14px 40px 14px 40px;
            }

            .login-btn {
                padding: 14px;
                font-size: 1rem;
            }

            .admin-features {
                padding: 20px;
            }

            .admin-features li {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 360px) {
            .admin-card {
                padding: 30px 20px;
            }

            .admin-header h2 {
                font-size: 1.5rem;
            }

            .admin-header p {
                font-size: 0.85rem;
            }

            .back-home a {
                padding: 6px 12px;
                font-size: 0.85rem;
            }

            .form-group label {
                font-size: 0.8rem;
            }

            .security-note {
                font-size: 0.75rem;
                padding: 12px;
            }
        }

        /* ===== CUSTOM SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a2e1a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #2e7d32, #66bb6a);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, #1b5e20, #4caf50);
        }
    </style>
</head>

<body>
    <div class="admin-container">

        <div class="admin-card">
            <div class="admin-header">
                <i class="fas fa-lock"></i>
                <h2>Admin Access</h2>
                <p>Secure administrator portal</p>
                <span class="admin-badge">Authorized Personnel Only</span>
            </div>

            <div class="alert" id="alertMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter admin username" value="" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-key"></i> Password
                    </label>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" placeholder="Enter admin password" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Login as Admin
                </button>
            </form>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const alertMessage = document.getElementById('alertMessage');
        const loginBtn = document.getElementById('loginBtn');

        // Toggle password visibility
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Handle login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showAlert('Please enter both username and password', 'error');
                return;
            }

            try {
                loadingOverlay.style.display = 'flex';
                loginBtn.disabled = true;

                const response = await fetch('/api/auth/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Login successful! Redirecting to admin dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Invalid credentials', 'error');
                }

            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred. Please try again.', 'error');
            } finally {
                loadingOverlay.style.display = 'none';
                loginBtn.disabled = false;
            }
        });

        // Check if already logged in
        async function checkSession() {
            try {
                const response = await fetch('/api/auth/check-session');
                const data = await response.json();

                if (data.authenticated && data.user.role === 'admin') {
                    window.location.href = '/admin-dashboard';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }

        checkSession();

        function showAlert(message, type) {
            alertMessage.textContent = message;
            alertMessage.className = `alert alert-${type}`;
            alertMessage.style.display = 'block';

            setTimeout(() => {
                alertMessage.style.display = 'none';
            }, 5000);
        }

        // Add animation on scroll
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.admin-features li').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'all 0.6s ease';
            observer.observe(el);
        });
    </script>
</body>

</html>
